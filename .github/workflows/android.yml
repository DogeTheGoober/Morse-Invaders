name: Build Android APK

# Produces an installable debug APK (debug-signed, so it installs directly — the
# Android equivalent of sideloading). Builds on Linux; no Mac required.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Add Android platform (generates the Gradle project)
        run: npx cap add android

      - name: Sync web assets + native plugins
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MorseInvaders-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
