name: Build iOS IPA (unsigned)

# Produces an UNSIGNED .ipa you can sign + install with Sideloadly / AltStore.
# Runs on GitHub's free macOS runners — no Mac required on your end.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Add iOS platform (generates the Xcode project)
        run: npx cap add ios

      - name: Sync web assets + native plugins
        run: npx cap sync ios

      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Package unsigned .ipa
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -r MorseInvaders-unsigned.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: MorseInvaders-ipa
          path: ${{ runner.temp }}/MorseInvaders-unsigned.ipa
          if-no-files-found: error
